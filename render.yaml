# Render service configuration for automation-02
# Two deployment options shown below.

services:
  - type: web
    name: automation-02-web
    env: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn ultra_powerful_app_enhanced:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_PATH
        value: /data/multi_center_automation.db
        sync: false

# Notes:
# - This configuration uses Render's Python environment and the project's
#   `requirements.txt`. It will work for the web app portion that does not
#   require a headful Chrome/driver at runtime.
# - If your app uses Selenium/ChromeDriver (it appears this project may),
#   prefer deploying using a Docker service (select "Dockerfile" in Render)
#   or use the provided Dockerfiles in the repo (e.g., `Dockerfile_enhanced`).
# - Do NOT commit sensitive values like `SYSTEM_PASSWORD` to the repo; set
#   them in the Render dashboard under Environment > Environment Variables.
services:
  - type: web
    name: wafid-booking-system
    env: python
    plan: starter
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements_ultra_powerful.txt
      
      # Install Chrome dependencies for Selenium
      apt-get update
      apt-get install -y wget gnupg2 software-properties-common
      wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | apt-key add -
      echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list
      apt-get update
      apt-get install -y google-chrome-stable
      
      # Install ChromeDriver
      CHROME_DRIVER_VERSION=$(curl -sS chromedriver.storage.googleapis.com/LATEST_RELEASE)
      wget -O /tmp/chromedriver.zip http://chromedriver.storage.googleapis.com/$CHROME_DRIVER_VERSION/chromedriver_linux64.zip
      unzip /tmp/chromedriver.zip chromedriver -d /usr/local/bin/
      chmod +x /usr/local/bin/chromedriver
      
    startCommand: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT ultra_powerful_app:socketio
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DISPLAY
        value: :99
      - key: CHROME_BIN
        value: /usr/bin/google-chrome
      - key: CHROMEDRIVER_PATH
        value: /usr/local/bin/chromedriver
      - key: SYSTEM_PASSWORD
        fromSecret: SYSTEM_PASSWORD
